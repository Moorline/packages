name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: actions/checkout@v4
        with:
          repository: Moorline/kit
          path: kit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd ../moorline && bun install --frozen-lockfile
      - run: cd ../moorline && bun run --filter '@moorline/contracts' build
      - run: cd ../kit && bun install --frozen-lockfile
      - name: Link local contracts into kit checkout
        run: |
          mkdir -p ../kit/node_modules/@moorline
          rm -rf ../kit/node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" ../kit/node_modules/@moorline/contracts
      - run: cd ../kit && bun run build:packages
      - run: bun install --frozen-lockfile
      - name: Link local split-repo packages
        run: |
          mkdir -p node_modules/@moorline
          rm -rf node_modules/@moorline/contracts node_modules/@moorline/package-kit
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/kit/packages/package-kit" node_modules/@moorline/package-kit
      - run: bun run build:packages
      - run: bun run check:fast

  installable-smoke:
    needs: fast-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: actions/checkout@v4
        with:
          repository: Moorline/kit
          path: kit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd ../moorline && bun install --frozen-lockfile
      - run: cd ../moorline && bun run --filter '@moorline/contracts' build
      - run: cd ../kit && bun install --frozen-lockfile
      - name: Link local contracts into kit checkout
        run: |
          mkdir -p ../kit/node_modules/@moorline
          rm -rf ../kit/node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" ../kit/node_modules/@moorline/contracts
      - run: cd ../kit && bun run build:packages
      - run: bun install --frozen-lockfile
      - name: Link local split-repo packages
        run: |
          mkdir -p node_modules/@moorline
          rm -rf node_modules/@moorline/contracts node_modules/@moorline/package-kit
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/kit/packages/package-kit" node_modules/@moorline/package-kit
      - run: bun run build
      - run: bun run build:official-npm-packages
      - run: find dist/installable-archives -type f -name '*.tar.gz' -print | sort
      - run: npm pack ./dist/npm-packages/@moorline/basic-essentials
      - run: npm pack ./dist/npm-packages/@moorline/discord-default

  full-gate:
    needs: installable-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: actions/checkout@v4
        with:
          repository: Moorline/kit
          path: kit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd ../moorline && bun install --frozen-lockfile
      - run: cd ../moorline && bun run --filter '@moorline/contracts' build
      - run: cd ../kit && bun install --frozen-lockfile
      - name: Link local contracts into kit checkout
        run: |
          mkdir -p ../kit/node_modules/@moorline
          rm -rf ../kit/node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" ../kit/node_modules/@moorline/contracts
      - run: cd ../kit && bun run build:packages
      - run: bun install --frozen-lockfile
      - name: Link local split-repo packages
        run: |
          mkdir -p node_modules/@moorline
          rm -rf node_modules/@moorline/contracts node_modules/@moorline/package-kit
          ln -s "${GITHUB_WORKSPACE}/moorline/packages/contracts" node_modules/@moorline/contracts
          ln -s "${GITHUB_WORKSPACE}/kit/packages/package-kit" node_modules/@moorline/package-kit
      - run: bun run check
