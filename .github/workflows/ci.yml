name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: actions/checkout@v4
        with:
          repository: Moorline/kit
          path: kit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun --cwd ../moorline install --frozen-lockfile
      - run: bun --cwd ../moorline run --filter '@moorline/contracts' build
      - run: bun --cwd ../kit install --frozen-lockfile
      - run: bun --cwd ../kit run build:packages
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run check:fast

  installable-smoke:
    needs: fast-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: actions/checkout@v4
        with:
          repository: Moorline/kit
          path: kit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun --cwd ../moorline install --frozen-lockfile
      - run: bun --cwd ../moorline run --filter '@moorline/contracts' build
      - run: bun --cwd ../kit install --frozen-lockfile
      - run: bun --cwd ../kit run build:packages
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:official-npm-packages
      - run: find dist/installable-archives -type f -name '*.tar.gz' -print | sort
      - run: test -f dist/resources/official-catalog.json
      - run: npm pack ./dist/npm-packages/@moorline/basic-essentials
      - run: npm pack ./dist/npm-packages/@moorline/discord-default

  full-gate:
    needs: installable-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: Moorline/moorline
          path: moorline
      - uses: actions/checkout@v4
        with:
          repository: Moorline/kit
          path: kit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun --cwd ../moorline install --frozen-lockfile
      - run: bun --cwd ../moorline run --filter '@moorline/contracts' build
      - run: bun --cwd ../kit install --frozen-lockfile
      - run: bun --cwd ../kit run build:packages
      - run: bun install --frozen-lockfile
      - run: bun run check
